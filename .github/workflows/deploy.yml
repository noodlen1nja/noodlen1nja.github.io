name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway through; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Stage site files
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            --exclude '.DS_Store' \
            ./ _site/

          # 404.html can be served at any path, so its home link must be absolute:
          # "/" for a user site (username.github.io), "/<repo>/" for a project site.
          sed -i "s#href=\"/\" data-home#href=\"${BASE_PATH}/\" data-home#" _site/404.html

          if [ ! -f _site/resume.pdf ]; then
            echo "::warning title=resume.pdf missing::Add resume.pdf to the repo root. The Download Resume buttons will 404 until you do."
          fi

          echo "Deploying these files:"
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
