<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Rohith Menon</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <!-- Styles are inlined on purpose: this page can be served at any path, so relative asset URLs would break. -->
  <style>
    :root { --bg: #f7f9fb; --text: #0c1620; --muted: #46566a; --accent: #0f766e; --on-accent: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0a0f14; --text: #e5ebf0; --muted: #a3b0bc; --accent: #4fd1c1; --on-accent: #05201c; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      background: var(--bg); color: var(--text);
      font: 400 1rem/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 32rem; }
    .code { margin: 0; color: var(--accent); font: 500 .875rem/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    h1 { margin: .9rem 0 .5rem; font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.1; letter-spacing: -.03em; }
    p { margin: 0; color: var(--muted); }
    a {
      display: inline-block; margin-top: 1.75rem; padding: .7rem 1.1rem; border-radius: 10px;
      background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404 · not found</p>
    <h1>This page wandered off.</h1>
    <p>The link may be broken, or the page may have moved.</p>
    <!-- The deploy workflow rewrites href="/" to your Pages base path (e.g. /portfolio/). Keep data-home. -->
    <a href="/" data-home>Back to home</a>
  </main>
</body>
</html>
